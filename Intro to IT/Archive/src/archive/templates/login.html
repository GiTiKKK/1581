<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 60px auto; }
    input { display: block; width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; cursor: pointer; }
    .err { color: red; }
  </style>
</head>
<body>
  <h2>Вход</h2>
  <input id="inp-email" type="email" placeholder="Email">
  <input id="inp-password" type="password" placeholder="Пароль">
  <button onclick="doLogin()">Войти</button>
  <p class="err" id="err"></p>
  <p><a href="/">Нет аккаунта? Зарегистрироваться</a></p>

  <script>
    async function doLogin() {
      const body = {
        email:    document.getElementById('inp-email').value.trim(),
        password: document.getElementById('inp-password').value,
      };
      try {
        const res = await fetch('/user_login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.result) {
          location.href = '/lk';
        } else {
          document.getElementById('err').textContent = data.error || 'Ошибка входа';
        }
      } catch (e) {
        document.getElementById('err').textContent = 'Ошибка сети: ' + e.message;
      }
    }
  </script>
</body>
</html>
