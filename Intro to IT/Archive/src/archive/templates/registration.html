<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 60px auto; }
    input { display: block; width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; cursor: pointer; }
    .err { color: red; }
  </style>
</head>
<body>
  <h2>Регистрация</h2>
  <input id="inp-name" placeholder="Имя">
  <input id="inp-surname" placeholder="Фамилия">
  <input id="inp-email" type="email" placeholder="Email">
  <input id="inp-password" type="password" placeholder="Пароль">
  <button onclick="register()">Зарегистрироваться</button>
  <p class="err" id="err"></p>
  <p><a href="/login">Уже есть аккаунт? Войти</a></p>

  <script>
    async function register() {
      const body = {
        name:     document.getElementById('inp-name').value.trim(),
        surname:  document.getElementById('inp-surname').value.trim(),
        email:    document.getElementById('inp-email').value.trim(),
        password: document.getElementById('inp-password').value,
      };
      if (!body.name || !body.email || !body.password) {
        document.getElementById('err').textContent = 'Заполните имя, email и пароль';
        return;
      }
      try {
        const res = await fetch('/user_register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.result) {
          alert('Успех! Теперь войдите.');
          location.href = '/login';
        } else {
          document.getElementById('err').textContent = data.error || 'Ошибка регистрации';
        }
      } catch (e) {
        document.getElementById('err').textContent = 'Ошибка сети: ' + e.message;
      }
    }
  </script>
</body>
</html>
