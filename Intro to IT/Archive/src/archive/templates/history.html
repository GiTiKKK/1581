<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>История запросов</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; }
    .item { border: 1px solid #ccc; padding: 12px; border-radius: 6px; margin: 10px 0; }
    .q { color: #2563eb; font-weight: bold; }
    .a { margin-top: 6px; white-space: pre-wrap; }
    .time { color: #888; font-size: 12px; }
    a.back { display: inline-block; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>История запросов</h2>
  {% if rows %}
    {% for r in rows %}
      <div class="item">
        <div class="time">{{ r.created_at }}</div>
        <div class="q">Вы: {{ r.message }}</div>
        <div class="a">Нейросеть: {{ r.answer }}</div>
      </div>
    {% endfor %}
  {% else %}
    <p>Пока нет запросов.</p>
  {% endif %}
  <a class="back" href="/lk">← Назад в ЛК</a>
</body>
</html>
